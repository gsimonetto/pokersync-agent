<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>PokerSync Agent</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>PokerSync Agent</h1>
      <p class="subtitle">Encontra hand histories e torneios jogados no seu computador e sincroniza com o PokerSync.</p>

      <section class="panel" id="panel-config">
        <h2>Conexão</h2>
        <label for="base-url">URL do PokerSync</label>
        <input type="text" id="base-url" placeholder="https://app.pokersync.com" />
        <div class="row">
          <button id="btn-save-url">Salvar URL</button>
          <button id="btn-test" class="secondary">Testar conexão</button>
        </div>
        <div id="config-status" class="status"></div>
      </section>

      <section class="panel" id="panel-login">
        <h2>Conta</h2>
        <div id="login-form">
          <label for="email">Email</label>
          <input type="email" id="email" />
          <label for="password">Senha</label>
          <input type="password" id="password" />
          <button id="btn-login">Entrar</button>
        </div>
        <div id="logged-in" class="hidden">
          <p>Conectado como <strong id="user-email"></strong> <span class="pill" id="device-name-pill"></span></p>
          <button id="btn-logout" class="secondary">Sair</button>
        </div>
        <div id="login-status" class="status"></div>
      </section>

      <section class="panel" id="panel-scan">
        <h2>Salas de poker</h2>
        <div class="rooms" id="rooms"></div>
        <div class="row">
          <button id="btn-scan" class="secondary">Buscar no computador</button>
          <button id="btn-sync">Sincronizar agora</button>
        </div>
        <table id="results-table" class="hidden">
          <thead>
            <tr><th>Sala</th><th>Arquivos encontrados</th><th>Pendentes</th></tr>
          </thead>
          <tbody id="results-body"></tbody>
        </table>
        <div id="scan-status" class="status"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
