name: Release

# Gera os instaladores do PokerSync Agent por SO e publica como GitHub
# Release (draft) com os binários anexados — o jeito mais simples de testar
# sem precisar instalar Rust/Tauri localmente. Disparo manual (Actions ->
# Release -> Run workflow) ou por tag "v*".
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Instala dependências do Linux (WebKitGTK)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Instala Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache do cargo
        uses: Swatinem/rust-cache@v2

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "PokerSync Agent v__VERSION__"
          releaseBody: |
            Instalador do PokerSync Agent para teste. Veja o README para o
            passo a passo (URL do PokerSync + login).
          releaseDraft: true
          prerelease: true
